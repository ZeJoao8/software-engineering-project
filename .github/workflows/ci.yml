name: CI

on:
  push:
    branches: [ main, sprint0, sprint1, sprint2, sprint3]
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UniLink

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: UniLink/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --watchAll=false
