appId: host.exp.exponent
---
- runFlow: ../subflows/launch.yaml

- tapOn:
    id: loginEmailInput
- inputText: "wronguser@feup.pt"
- pressKey: Enter

- tapOn:
    id: loginPasswordInput
- eraseText
- inputText: "wrongpass"
- pressKey: Enter

- tapOn:
    id: authSubmitButton
    
- waitForAnimationToEnd

# O alerta de React Native usa texto genérico (depende do idioma do Firebase), testamos apenas que o alert aparece
- assertVisible: "OK"
- tapOn: "OK"

# A UI deve continuar na página de Autenticação
- assertVisible:
    id: authScreenTitle
