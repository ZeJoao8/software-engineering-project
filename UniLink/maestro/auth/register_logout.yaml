appId: host.exp.exponent
---
- runFlow: ../subflows/launch.yaml

# Gerar email único para não colidir com contas existentes
- evalScript: ${output.email = "test" + Date.now() + "@up.pt"}

# Mudar para modo registo
- tapOn:
    id: authModeToggleButton
- waitForAnimationToEnd

# Preencher formulário
- tapOn:
    id: registerNameInput
- inputText: "E2E Test User"
- pressKey: Enter

- tapOn:
    id: registerUniversityInput
- inputText: "UP"
- pressKey: Enter

- tapOn:
    id: registerCourseInput
- inputText: "LEIC"
- pressKey: Enter

- tapOn:
    id: genderPicker
- tapOn: "Male"

- tapOn:
    id: loginEmailInput
- inputText: ${output.email}
- pressKey: Enter

- tapOn:
    id: loginPasswordInput
- inputText: "12345678"
- pressKey: Enter

- tapOn:
    id: registerConfirmPasswordInput
- inputText: "12345678"
- pressKey: Enter

- tapOn:
    id: authSubmitButton
- waitForAnimationToEnd

# Verificar que chegou à app
- assertVisible: "Search rides"

# Logout
- tapOn:
    id: profileTab
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn:
    id: logoutButton
- tapOn: "Logout"
- waitForAnimationToEnd

# Verificar que voltou ao ecrã de login
- assertVisible:
    id: authScreenTitle
