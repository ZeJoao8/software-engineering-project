appId: host.exp.Exponent
---

- tapOn: "Create account"
- tapOn: "Name"
- inputText: "Test User"
- pressKey: Enter

- tapOn: "Email"
- inputText: "test@feup.pt"
- pressKey: Enter

- tapOn: "Password"
- inputText: "123"
- pressKey: Enter

- tapOn: "University"
- inputText: "FEUP"
- pressKey: Enter

- tapOn: "Course"
- inputText: "LEIC"
- pressKey: Enter

- hideKeyboard

- tapOn: { id: "genderPicker" }
- tapOn: "Female"
- tapOn: { id: "registerButton" }
- assertVisible: "Search Rides"
