appId: host.exp.exponent

---

- launchApp

- openLink: exp://192.168.1.136:8081

- waitForAnimationToEnd

#################################
# GARANTIR LOGOUT INICIAL
#################################

- runFlow:
    when:
      visible:
        id: profileTab
    commands:

      - tapOn:
          id: profileTab

      - swipe:
          direction: UP

      - tapOn:
          id: logoutButton

      - tapOn: "Logout"

#################################
# GERAR EMAIL ÚNICO
#################################

- evalScript: ${output.email = "maria" + Date.now() + "@feup.pt"}

#################################
# REGISTAR CONTA FEMALE
#################################

- tapOn:
    id: authModeToggleButton

- tapOn:
    id: registerNameInput
- inputText: "Maria Test"
- pressKey: Enter

- tapOn:
    id: registerUniversityInput
- inputText: "FEUP"
- pressKey: Enter

- tapOn:
    id: registerCourseInput
- inputText: "LEIC"
- pressKey: Enter

- tapOn:
    id: genderPicker
- tapOn: "Female"

- tapOn:
    id: loginEmailInput
- inputText: ${output.email}
- pressKey: Enter

- tapOn:
    id: loginPasswordInput
- inputText: "123456"
- pressKey: Enter

- tapOn:
    id: registerConfirmPasswordInput
- inputText: "123456"
- pressKey: Enter

- tapOn:
    id: authSubmitButton
- tapOn:
    id: authSubmitButton

- assertVisible: "Search rides"

#################################
# EDITAR PERFIL
#################################

- tapOn:
    id: profileTab

- tapOn:
    id: editProfileButton

- tapOn:
    id: profileCourseInput
- eraseText
- inputText: "MIEIC"
- pressKey: Enter

#################################
# ADICIONAR CARRO
#################################

- tapOn:
    id: toggleAddCarButton

- swipe:
    direction: UP

- tapOn:
    id: carModelInput
- inputText: "Toyota Yaris"
- pressKey: Enter

- tapOn:
    id: carColorInput
- inputText: "White"
- pressKey: Enter

- tapOn:
    id: carPlateInput
- inputText: "AA-00-BB"
- pressKey: Enter

- tapOn:
    id: carSeatsInput
- inputText: "5"
- pressKey: Enter

- tapOn:
    id: saveCarButton

- tapOn:
    id: saveProfileButton

- tapOn: "OK"

#################################
# CRIAR RIDE NORMAL
#################################

- tapOn:
    id: createTab

- tapOn:
    id: createRideOriginInput
- inputText: "FEUP"
- pressKey: Enter

- tapOn:
    id: createRideDestinationInput
- inputText: "Boavista"
- pressKey: Enter

- tapOn:
    id: createRideSeatsInput
- inputText: "2"
- pressKey: Enter

- tapOn:
    id: createRideButton

- tapOn: "OK"

#################################
# CRIAR RIDE WOMEN ONLY
#################################

- tapOn:
    id: createTab

- tapOn:
    id: createRideOriginInput
- eraseText
- inputText: "Boavista"
- pressKey: Enter

- tapOn:
    id: createRideDestinationInput
- eraseText
- inputText: "FEUP"
- pressKey: Enter

- tapOn:
    id: createRideSeatsInput
- eraseText
- inputText: "1"
- pressKey: Enter

- tapOn:
    id: createRideWomenOnlySwitch

- tapOn:
    id: createRideButton

- tapOn: "OK"

#################################
# LOGOUT
#################################

- tapOn:
    id: profileTab

- tapOn:
    id: logoutButton

- tapOn: "Logout"