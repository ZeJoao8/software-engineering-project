appId: host.exp.exponent
---
# Given: João opens the app and selects his profile
- openLink: "exp://192.168.10.230:8081"
- waitForAnimationToEnd
- tapOn: "JOÃO (MALE)"
- waitForAnimationToEnd

# When: João creates a ride Porto -> Lisboa
- tapOn: "Create"
- waitForAnimationToEnd
- tapOn: "Origin"
- inputText: "Porto"
- pressKey: enter
- tapOn: "Destination"
- inputText: "Lisboa"
- pressKey: enter
- waitForAnimationToEnd
- tapOn:
    id: "create-ride-button"
- waitForAnimationToEnd
- assertVisible: "Ride created"
- tapOn: "OK"
- waitForAnimationToEnd

# When: Maria switches profile
- tapOn: "Profile"
- waitForAnimationToEnd
- tapOn: "MARIA (FEMALE)"
- waitForAnimationToEnd

# When: Maria reserves the ride
- tapOn: "Search"
- waitForAnimationToEnd
- tapOn: "Porto → Lisboa"
- waitForAnimationToEnd
- tapOn: "Reserve seat"
- waitForAnimationToEnd

