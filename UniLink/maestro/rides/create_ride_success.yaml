appId: host.exp.exponent
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/login.yaml

# CRIAR VIAGEM — botão "Create +" no header da tab Rides
- tapOn:
    id: createRideHeaderButton

# --- ORIGEM ---
- tapOn:
    id: createRideOriginInput
- inputText: "FEUP, Porto"
# Aguarda debounce (500ms) + chamada à API Nominatim (~2s)
- extendedWaitUntil:
    visible:
      id: createRideOriginInput-suggestion-0
    timeout: 8000
# Clica na primeira sugestão de morada
- tapOn:
    id: createRideOriginInput-suggestion-0
- waitForAnimationToEnd

# --- DESTINO ---
- tapOn:
    id: createRideDestinationInput
- inputText: "Boavista, Porto"
- extendedWaitUntil:
    visible:
      id: createRideDestinationInput-suggestion-0
    timeout: 8000
- tapOn:
    id: createRideDestinationInput-suggestion-0
- waitForAnimationToEnd

# Aguarda o mapa de rota aparecer (indicador que as coordenadas foram salvas)
- assertVisible: "✓ Location defined"

# --- LUGARES ---
- tapOn:
    id: createRideSeatsInput
- inputText: "2"
- pressKey: Enter

# --- CRIAR ---
- tapOn:
    id: createRideButton

- waitForAnimationToEnd
- tapOn: "OK"

# Verifica redirecionamento para My Rides
- assertVisible: "My rides"
