appId: host.exp.exponent
env:
    EXPO_URL: "exp://10.0.2.2:8081"
---
- launchApp
- openLink: ${EXPO_URL}
- waitForAnimationToEnd

# Se já estiver logado, faz logout para começar limpo
- runFlow:
    when:
      visible:
        id: profileTab
    commands:
      - tapOn:
          id: profileTab
      - swipe:
          direction: UP
      - swipe:
          direction: UP
      - swipe:
          direction: UP
      - tapOn:
          id: logoutButton
      - tapOn: "Logout"
      - waitForAnimationToEnd
