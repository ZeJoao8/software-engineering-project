# Subflow reutilizável para login.
# Parâmetros: EMAIL, PASSWORD (passados via env no runFlow pai)
appId: host.exp.exponent
---
- tapOn:
    id: loginEmailInput
- inputText: ${EMAIL}
- pressKey: Enter

- tapOn:
    id: loginPasswordInput
- eraseText: 20
- inputText: ${PASSWORD}
- pressKey: Enter

- tapOn:
    id: authSubmitButton

- waitForAnimationToEnd
- assertVisible: "Search rides"
