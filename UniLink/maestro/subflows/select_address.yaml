# Subflow reutilizável para selecionar morada com AddressAutocomplete.
# Parâmetros: FIELD_TEST_ID, SEARCH_TEXT
appId: host.exp.exponent
---
- tapOn:
    id: ${FIELD_TEST_ID}
- inputText: ${SEARCH_TEXT}
- extendedWaitUntil:
    visible:
      id: ${FIELD_TEST_ID}-suggestion-0
    timeout: 8000
- tapOn:
    id: ${FIELD_TEST_ID}-suggestion-0
- waitForAnimationToEnd
