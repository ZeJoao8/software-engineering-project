<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="20" fill="white" font-size="13" font-weight="600">9:41</text>
  <path d="M24 66 L14 56 L24 46" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="205" y="63" text-anchor="middle" fill="white" font-size="19" font-weight="700">Avaliar Experiência</text>

  <!-- Ride summary card -->
  <rect x="16" y="126" width="358" height="100" fill="white" rx="12" filter="url(#shadow)"/>
  <circle cx="52" cy="176" r="24" fill="#e2e8f0"/>
  <text x="52" y="182" text-anchor="middle" fill="#64748b" font-size="14">JS</text>
  <text x="86" y="162" fill="#0f172a" font-size="16" font-weight="700">João Santos</text>
  <text x="86" y="181" fill="#64748b" font-size="13">⭐ 4.6 · Condutor</text>
  <text x="86" y="200" fill="#94a3b8" font-size="12">Lisboa → FEUP  ·  18/03/2026 08:30</text>
  <!-- Ride done checkmark -->
  <circle cx="358" cy="176" r="16" fill="#ecfdf5"/>
  <text x="358" y="182" text-anchor="middle" fill="#10b981" font-size="16">✓</text>

  <!-- How was your ride -->
  <text x="195" y="262" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Como foi a tua boleia?</text>
  <text x="195" y="284" text-anchor="middle" fill="#64748b" font-size="14">A tua avaliação ajuda a comunidade UniLink</text>

  <!-- Star rating -->
  <rect x="50" y="300" width="290" height="80" fill="white" rx="12" filter="url(#shadow)"/>
  <!-- 4 filled stars, 1 empty -->
  <text x="72" y="352" fill="#f59e0b" font-size="40">★</text>
  <text x="126" y="352" fill="#f59e0b" font-size="40">★</text>
  <text x="180" y="352" fill="#f59e0b" font-size="40">★</text>
  <text x="234" y="352" fill="#f59e0b" font-size="40">★</text>
  <text x="288" y="352" fill="#e2e8f0" font-size="40">★</text>
  <!-- Rating label -->
  <text x="195" y="395" text-anchor="middle" fill="#64748b" font-size="13">Muito bom – 4 estrelas</text>

  <!-- Quick reaction chips -->
  <text x="24" y="428" fill="#0f172a" font-size="14" font-weight="600">O que correu bem?</text>
  <!-- Chips row 1 -->
  <rect x="24" y="438" width="100" height="32" fill="#ecfdf5" rx="16" stroke="#10b981" stroke-width="1.5"/>
  <text x="74" y="459" text-anchor="middle" fill="#047857" font-size="13" font-weight="500">Pontual ✓</text>
  <rect x="134" y="438" width="116" height="32" fill="#ecfdf5" rx="16" stroke="#10b981" stroke-width="1.5"/>
  <text x="192" y="459" text-anchor="middle" fill="#047857" font-size="13" font-weight="500">Carro limpo ✓</text>
  <rect x="260" y="438" width="106" height="32" fill="#f8fafc" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="313" y="459" text-anchor="middle" fill="#64748b" font-size="13">Simpático</text>
  <!-- Chips row 2 -->
  <rect x="24" y="480" width="134" height="32" fill="#f8fafc" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="91" y="501" text-anchor="middle" fill="#64748b" font-size="13">Condução segura</text>
  <rect x="168" y="480" width="100" height="32" fill="#f8fafc" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="218" y="501" text-anchor="middle" fill="#64748b" font-size="13">Boa música</text>

  <!-- Comment box -->
  <text x="24" y="534" fill="#0f172a" font-size="14" font-weight="600">Comentário (opcional)</text>
  <rect x="16" y="544" width="358" height="90" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="570" fill="#94a3b8" font-size="14">Deixa um comentário sobre a viagem...</text>

  <!-- Submit button -->
  <rect x="16" y="650" width="358" height="52" fill="#10b981" rx="12"/>
  <text x="195" y="682" text-anchor="middle" fill="white" font-size="17" font-weight="700">Submeter Avaliação</text>

  <!-- Skip link -->
  <text x="195" y="722" text-anchor="middle" fill="#94a3b8" font-size="14">Saltar por agora</text>

  <!-- 4-tab green nav bar (Minhas active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#064e3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#064e3b" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#ecfdf5" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#064e3b" stroke-width="1.8"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Perfil</text>
</svg>
