<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="22" fill="#ecfdf5" font-size="13" font-weight="600">9:41</text>
  <text x="195" y="54" text-anchor="middle" fill="#ecfdf5" font-size="17" font-weight="700">Boleia em Curso</text>
  <!-- Live indicator -->
  <circle cx="284" cy="50" r="5" fill="#ef4444"/>
  <text x="294" y="55" fill="#ecfdf5" font-size="13">AO VIVO</text>
  <text x="195" y="74" text-anchor="middle" fill="#d1fae5" font-size="13">Lisboa – Marquês → FEUP</text>
  <text x="195" y="92" text-anchor="middle" fill="#d1fae5" font-size="12">A caminho · ~18 min restantes</text>

  <!-- Map area -->
  <rect x="16" y="118" width="358" height="180" fill="#e8f5e9" rx="14"/>
  <!-- Map roads -->
  <line x1="16" y1="198" x2="374" y2="198" stroke="#c8e6c9" stroke-width="10"/>
  <line x1="120" y1="118" x2="120" y2="298" stroke="#c8e6c9" stroke-width="8"/>
  <line x1="260" y1="118" x2="260" y2="298" stroke="#c8e6c9" stroke-width="6"/>
  <!-- Route path -->
  <path d="M 60 248 Q 110 220 175 208 Q 230 198 295 172" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Current position (car icon area) -->
  <circle cx="175" cy="208" r="14" fill="#10b981" stroke="white" stroke-width="2.5"/>
  <text x="175" y="214" text-anchor="middle" fill="white" font-size="12">🚗</text>
  <!-- Origin pin -->
  <circle cx="60" cy="248" r="8" fill="#64748b"/>
  <circle cx="60" cy="248" r="4" fill="white"/>
  <!-- Dest pin -->
  <circle cx="295" cy="172" r="8" fill="#ef4444"/>
  <circle cx="295" cy="172" r="4" fill="white"/>
  <!-- Map labels -->
  <text x="46" y="268" fill="#64748b" font-size="10">Marquês</text>
  <text x="281" y="168" fill="#64748b" font-size="10">FEUP</text>
  <!-- Progress bar -->
  <rect x="28" y="278" width="334" height="6" fill="#a7f3d0" rx="3"/>
  <rect x="28" y="278" width="140" height="6" fill="#10b981" rx="3"/>
  <text x="195" y="296" text-anchor="middle" fill="#047857" font-size="11">40% do percurso concluído</text>

  <!-- Passengers section -->
  <text x="24" y="326" fill="#94a3b8" font-size="12" font-weight="600">PASSAGEIROS  ·  2 A BORDO</text>

  <!-- Passenger 1 (código verificado) -->
  <rect x="16" y="334" width="358" height="64" fill="white" rx="12" filter="url(#sh)"/>
  <circle cx="52" cy="366" r="20" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="52" y="372" text-anchor="middle" fill="#047857" font-size="13" font-weight="600">AC</text>
  <text x="82" y="357" fill="#0f172a" font-size="14" font-weight="600">Ana Costa</text>
  <text x="82" y="375" fill="#64748b" font-size="12">Lugar 1  ·  Marquês de Pombal</text>
  <!-- Verified badge -->
  <rect x="256" y="352" width="106" height="26" fill="#ecfdf5" rx="13"/>
  <text x="309" y="370" text-anchor="middle" fill="#047857" font-size="12" font-weight="600">✓ Verificado</text>

  <!-- Passenger 2 (código verificado) -->
  <rect x="16" y="408" width="358" height="64" fill="white" rx="12" filter="url(#sh)"/>
  <circle cx="52" cy="440" r="20" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="52" y="446" text-anchor="middle" fill="#047857" font-size="13" font-weight="600">JS</text>
  <text x="82" y="431" fill="#0f172a" font-size="14" font-weight="600">João Santos</text>
  <text x="82" y="449" fill="#64748b" font-size="12">Lugar 2  ·  Marquês de Pombal</text>
  <rect x="256" y="426" width="106" height="26" fill="#ecfdf5" rx="13"/>
  <text x="309" y="444" text-anchor="middle" fill="#047857" font-size="12" font-weight="600">✓ Verificado</text>

  <!-- Verify code button -->
  <rect x="16" y="484" width="358" height="50" fill="white" rx="12" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="195" y="514" text-anchor="middle" fill="#10b981" font-size="14" font-weight="600">🔒  Verificar Código de Passageiro</text>

  <!-- Trip info card -->
  <rect x="16" y="546" width="358" height="86" fill="white" rx="12" filter="url(#sh)"/>
  <text x="32" y="570" fill="#94a3b8" font-size="12" font-weight="600">DETALHES DA VIAGEM</text>
  <!-- Info items -->
  <text x="32" y="594" fill="#64748b" font-size="13">📅  18/03/2026  ·  08:30</text>
  <text x="32" y="614" fill="#64748b" font-size="13">🚗  Renault Clio · 45-AB-23</text>
  <text x="195" y="594" fill="#64748b" font-size="13">⏱  ~35 min total</text>
  <text x="195" y="614" fill="#64748b" font-size="13">🌳  ~2.8 kg CO₂ poupado</text>

  <!-- End ride button -->
  <rect x="16" y="644" width="358" height="52" fill="#ef4444" rx="28"/>
  <text x="195" y="676" text-anchor="middle" fill="white" font-size="16" font-weight="700">Terminar Boleia</text>

  <!-- 4-tab green nav bar (Boleias active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#ecfdf5" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#064e3b" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#064e3b" stroke-width="1.8"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Perfil</text>
</svg>
