<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="22" fill="#ecfdf5" font-size="13" font-weight="600">9:41</text>
  <path d="M26 66 L16 56 L26 46" stroke="#ecfdf5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="58" text-anchor="middle" fill="#ecfdf5" font-size="17" font-weight="700">Contactos de Segurança</text>
  <text x="195" y="78" text-anchor="middle" fill="#d1fae5" font-size="13">Notificados em caso de emergência</text>

  <!-- Info banner -->
  <rect x="16" y="120" width="358" height="62" fill="#ecfdf5" rx="12"/>
  <text x="38" y="143" fill="#047857" font-size="13" font-weight="600">🛡️  Como funciona?</text>
  <text x="38" y="160" fill="#047857" font-size="12">Os teus contactos recebem a tua localização e</text>
  <text x="38" y="175" fill="#047857" font-size="12">detalhes da boleia ao iniciar uma viagem.</text>

  <!-- Section label -->
  <text x="24" y="210" fill="#94a3b8" font-size="12" font-weight="600">CONTACTOS GUARDADOS  ·  2</text>

  <!-- Contact 1 (Mãe) -->
  <rect x="16" y="218" width="358" height="76" fill="white" rx="12" filter="url(#sh)"/>
  <circle cx="56" cy="256" r="22" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="56" y="262" text-anchor="middle" fill="#9d174d" font-size="18">👩</text>
  <text x="88" y="246" fill="#0f172a" font-size="14" font-weight="600">Mãe</text>
  <text x="88" y="264" fill="#64748b" font-size="13">+351 912 345 678</text>
  <text x="88" y="282" fill="#10b981" font-size="12">✓ Notificações activas</text>
  <!-- Edit icon -->
  <text x="356" y="256" text-anchor="end" fill="#94a3b8" font-size="18">✎</text>
  <!-- Delete icon -->
  <text x="356" y="278" text-anchor="end" fill="#ef4444" font-size="14">🗑</text>

  <!-- Contact 2 (Pai) -->
  <rect x="16" y="304" width="358" height="76" fill="white" rx="12" filter="url(#sh)"/>
  <circle cx="56" cy="342" r="22" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="56" y="348" text-anchor="middle" fill="#0369a1" font-size="18">👨</text>
  <text x="88" y="332" fill="#0f172a" font-size="14" font-weight="600">Pai</text>
  <text x="88" y="350" fill="#64748b" font-size="13">+351 934 567 890</text>
  <text x="88" y="368" fill="#10b981" font-size="12">✓ Notificações activas</text>
  <text x="356" y="342" text-anchor="end" fill="#94a3b8" font-size="18">✎</text>
  <text x="356" y="364" text-anchor="end" fill="#ef4444" font-size="14">🗑</text>

  <!-- Add contact button -->
  <rect x="16" y="394" width="358" height="52" fill="white" rx="12" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#sh)"/>
  <text x="195" y="425" text-anchor="middle" fill="#10b981" font-size="14" font-weight="600">+ Adicionar contacto</text>

  <!-- Section: Notificações -->
  <text x="24" y="474" fill="#94a3b8" font-size="12" font-weight="600">QUANDO NOTIFICAR</text>
  <rect x="16" y="482" width="358" height="170" fill="white" rx="12" filter="url(#sh)"/>

  <!-- Toggle: Ao iniciar boleia -->
  <text x="32" y="510" fill="#0f172a" font-size="14" font-weight="600">Ao iniciar boleia</text>
  <text x="32" y="528" fill="#64748b" font-size="12">Envia localização e detalhes da rota</text>
  <rect x="318" y="500" width="42" height="24" fill="#10b981" rx="12"/>
  <circle cx="350" cy="512" r="10" fill="white"/>
  <line x1="32" y1="540" x2="362" y2="540" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Toggle: Ao chegar ao destino -->
  <text x="32" y="562" fill="#0f172a" font-size="14" font-weight="600">Ao chegar ao destino</text>
  <text x="32" y="580" fill="#64748b" font-size="12">Confirma chegada segura</text>
  <rect x="318" y="554" width="42" height="24" fill="#10b981" rx="12"/>
  <circle cx="350" cy="566" r="10" fill="white"/>
  <line x1="32" y1="592" x2="362" y2="592" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Toggle: Se viagem atrasar -->
  <text x="32" y="614" fill="#0f172a" font-size="14" font-weight="600">Se viagem atrasar</text>
  <text x="32" y="632" fill="#64748b" font-size="12">Alerta se atrasar mais de 15 minutos</text>
  <rect x="318" y="606" width="42" height="24" fill="#bcbdc1" rx="12"/>
  <circle cx="330" cy="618" r="10" fill="white"/>

  <!-- 4-tab green nav bar (Perfil active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#064e3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#064e3b" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#064e3b" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#ecfdf5" stroke-width="2"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Perfil</text>
</svg>
