<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <!-- Status bar -->
  <text x="32" y="20" fill="white" font-size="13" font-weight="600">9:41</text>
  <!-- Back arrow -->
  <path d="M24 66 L14 56 L24 46" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Title -->
  <text x="205" y="63" text-anchor="middle" fill="white" font-size="19" font-weight="700">Detalhes da Boleia</text>

  <!-- Driver card -->
  <rect x="16" y="122" width="358" height="112" fill="white" rx="12" filter="url(#shadow)"/>
  <!-- Avatar -->
  <circle cx="62" cy="178" r="30" fill="#e2e8f0"/>
  <text x="62" y="183" text-anchor="middle" fill="#64748b" font-size="22">JS</text>
  <!-- Name + stars -->
  <text x="104" y="162" fill="#0f172a" font-size="17" font-weight="700">João Santos</text>
  <text x="104" y="182" fill="#f59e0b" font-size="15">★★★★</text>
  <text x="166" y="182" fill="#e2e8f0" font-size="15">★</text>
  <text x="180" y="182" fill="#64748b" font-size="13"> 4.6 · (38 avaliações)</text>
  <!-- Car -->
  <text x="104" y="202" fill="#64748b" font-size="13">🚗  Renault Clio · 45-AB-23</text>
  <!-- Women-only badge -->
  <rect x="290" y="154" width="72" height="22" fill="#fce7f3" rx="11"/>
  <text x="326" y="169" text-anchor="middle" fill="#ec4899" font-size="11" font-weight="600">Só ♀</text>

  <!-- Route card -->
  <rect x="16" y="248" width="358" height="158" fill="white" rx="12" filter="url(#shadow)"/>
  <text x="32" y="273" fill="#0f172a" font-size="15" font-weight="700">Trajeto</text>
  <!-- Origin -->
  <circle cx="44" cy="295" r="7" fill="#10b981"/>
  <text x="62" y="299" fill="#0f172a" font-size="14" font-weight="600">Lisboa – Marquês de Pombal</text>
  <!-- Dashed line -->
  <line x1="44" y1="302" x2="44" y2="330" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Destination -->
  <circle cx="44" cy="337" r="7" fill="#ef4444"/>
  <text x="62" y="341" fill="#0f172a" font-size="14" font-weight="600">FEUP – Porto</text>
  <!-- Divider -->
  <line x1="32" y1="358" x2="358" y2="358" stroke="#f1f5f9" stroke-width="1"/>
  <!-- Date and seats -->
  <text x="32" y="379" fill="#64748b" font-size="13">📅  18/03/2026 · 08:30</text>
  <text x="210" y="379" fill="#64748b" font-size="13">👥  3 lugares disponíveis</text>

  <!-- Map preview -->
  <rect x="16" y="420" width="358" height="148" fill="#ecfdf5" rx="12"/>
  <!-- Road lines (simplified map) -->
  <line x1="16" y1="480" x2="374" y2="480" stroke="#a7f3d0" stroke-width="10"/>
  <line x1="105" y1="420" x2="105" y2="568" stroke="#a7f3d0" stroke-width="8"/>
  <line x1="260" y1="420" x2="260" y2="568" stroke="#a7f3d0" stroke-width="6"/>
  <line x1="16" y1="524" x2="374" y2="524" stroke="#a7f3d0" stroke-width="5"/>
  <!-- Route polyline -->
  <path d="M 75 510 Q 130 460 190 462 Q 250 464 305 443" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Origin pin -->
  <circle cx="75" cy="510" r="8" fill="#10b981"/>
  <circle cx="75" cy="510" r="4" fill="white"/>
  <!-- Dest pin -->
  <circle cx="305" cy="443" r="8" fill="#ef4444"/>
  <circle cx="305" cy="443" r="4" fill="white"/>
  <!-- Map hint -->
  <text x="195" y="560" text-anchor="middle" fill="#64748b" font-size="11">Ver rota completa ↗</text>

  <!-- Reserve button -->
  <rect x="16" y="582" width="358" height="52" fill="#10b981" rx="12"/>
  <text x="195" y="614" text-anchor="middle" fill="white" font-size="17" font-weight="700">Reservar Lugar</text>

  <!-- Security code note -->
  <rect x="16" y="648" width="358" height="42" fill="#ecfdf5" rx="10"/>
  <text x="195" y="674" text-anchor="middle" fill="#047857" font-size="13">🔒  Receberás um código de segurança após reservar</text>

  <!-- 4-tab green nav bar (Boleias active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#ecfdf5" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#064e3b" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#064e3b" stroke-width="1.8"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Perfil</text>
</svg>
