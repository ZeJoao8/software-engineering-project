  <circle cx="44" cy="657" r="22" fill="#e2e8f0"/>
  <text x="44" y="663" text-anchor="middle" fill="#64748b" font-size="13">MS</text>
  <text x="76" y="646" fill="#0f172a" font-size="15" font-weight="700">Maria Santos</text>
  <rect x="308" y="636" width="50" height="18" fill="#ecfdf5" rx="9"/>
  <text x="333" y="649" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">Grátis</text>
  <text x="76" y="666" fill="#f59e0b" font-size="13">★★★★★</text>
  <text x="148" y="666" fill="#64748b" font-size="13"> 5.0</text>
  <text x="76" y="700" fill="#64748b" font-size="13">📅  20/03/2026 · 08:15  ·  👥 3 / 4</text>

  <!-- 4-tab green nav bar (Boleias active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#ecfdf5" stroke-width="2" rx="1"/>
