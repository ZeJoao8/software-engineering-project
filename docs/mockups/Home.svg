  <text x="333" y="541" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">Grátis</text>
  <text x="76" y="558" fill="#f59e0b" font-size="13">★★★★</text>
  <text x="130" y="558" fill="#e2e8f0" font-size="13">★</text>
  <text x="144" y="558" fill="#64748b" font-size="13"> 4.7</text>
