<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="20" fill="white" font-size="13" font-weight="600">9:41</text>
  <text x="195" y="63" text-anchor="middle" fill="white" font-size="19" font-weight="700">As Minhas Boleias</text>
  <!-- Filter icon top right -->
  <path d="M348 50 L368 50 M351 57 L365 57 M354 64 L362 64" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Tabs -->
  <rect x="16" y="118" width="358" height="40" fill="white" rx="10" filter="url(#shadow)"/>
  <!-- Active tab: Em Curso -->
  <rect x="20" y="122" width="172" height="32" fill="#10b981" rx="8"/>
  <text x="106" y="143" text-anchor="middle" fill="white" font-size="14" font-weight="600">Em Curso (2)</text>
  <text x="284" y="143" text-anchor="middle" fill="#64748b" font-size="14">Concluídas (5)</text>

  <!-- Ride card 1 – as driver -->
  <rect x="16" y="172" width="358" height="150" fill="white" rx="12" filter="url(#shadow)"/>
  <!-- Driver badge -->
  <rect x="28" y="184" width="62" height="20" fill="#ecfdf5" rx="10"/>
  <text x="59" y="198" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">🚗 Condutor</text>
  <!-- Date -->
  <text x="342" y="196" text-anchor="end" fill="#94a3b8" font-size="12">20/03/2026 · 08:30</text>
  <!-- Route -->
  <text x="28" y="224" fill="#0f172a" font-size="16" font-weight="700">Lisboa</text>
  <text x="110" y="224" fill="#94a3b8" font-size="16">→</text>
  <text x="126" y="224" fill="#0f172a" font-size="16" font-weight="700">FEUP</text>
  <!-- Passengers -->
  <text x="28" y="248" fill="#64748b" font-size="13">👥  2 / 4 passageiros confirmados</text>
  <!-- Divider -->
  <line x1="28" y1="264" x2="362" y2="264" stroke="#f1f5f9" stroke-width="1"/>
  <!-- Buttons -->
  <rect x="28" y="272" width="150" height="36" fill="white" rx="8" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="103" y="295" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">✏️  Editar</text>
  <rect x="188" y="272" width="150" height="36" fill="#fee2e2" rx="8"/>
  <text x="263" y="295" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="600">Cancelar</text>

  <!-- Ride card 2 – as passenger -->
  <rect x="16" y="336" width="358" height="130" fill="white" rx="12" filter="url(#shadow)"/>
  <!-- Passenger badge -->
  <rect x="28" y="348" width="68" height="20" fill="#f0f9ff" rx="10"/>
  <text x="62" y="362" text-anchor="middle" fill="#0284c7" font-size="11" font-weight="600">🧑 Passageiro</text>
  <text x="342" y="360" text-anchor="end" fill="#94a3b8" font-size="12">19/03/2026 · 09:00</text>
  <text x="28" y="388" fill="#0f172a" font-size="16" font-weight="700">FEUP</text>
  <text x="85" y="388" fill="#94a3b8" font-size="16">→</text>
  <text x="101" y="388" fill="#0f172a" font-size="16" font-weight="700">Cascais</text>
  <text x="28" y="410" fill="#64748b" font-size="13">🚗  Ana Costa · Renault Clio</text>
  <!-- Ver Detalhes -->
  <rect x="28" y="422" width="320" height="32" fill="#ecfdf5" rx="8"/>
  <text x="188" y="443" text-anchor="middle" fill="#047857" font-size="14" font-weight="600">Ver Detalhes →</text>

  <!-- Ride card 3 – upcoming -->
  <rect x="16" y="480" width="358" height="110" fill="white" rx="12" filter="url(#shadow)"/>
  <rect x="28" y="492" width="62" height="20" fill="#ecfdf5" rx="10"/>
  <text x="59" y="506" text-anchor="middle" fill="#047857" font-size="11" font-weight="600">🚗 Condutor</text>
  <text x="342" y="504" text-anchor="end" fill="#94a3b8" font-size="12">22/03/2026 · 17:45</text>
  <text x="28" y="532" fill="#0f172a" font-size="16" font-weight="700">FEUP</text>
  <text x="85" y="532" fill="#94a3b8" font-size="16">→</text>
  <text x="101" y="532" fill="#0f172a" font-size="16" font-weight="700">Matosinhos</text>
  <!-- Só mulheres badge -->
  <rect x="230" y="520" width="100" height="20" fill="#fce7f3" rx="10"/>
  <text x="280" y="534" text-anchor="middle" fill="#ec4899" font-size="11" font-weight="600">Só ♀ Mulheres</text>
  <text x="28" y="556" fill="#64748b" font-size="13">👥  0 / 3 passageiros</text>
  <text x="28" y="574" fill="#94a3b8" font-size="12">Ainda sem reservas</text>

  <!-- Empty state hint -->
  <text x="195" y="632" text-anchor="middle" fill="#94a3b8" font-size="13">Desliza para ver as concluídas</text>

  <!-- 4-tab green nav bar (Minhas active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#064e3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#064e3b" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#ecfdf5" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#064e3b" stroke-width="1.8"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Perfil</text>
</svg>
