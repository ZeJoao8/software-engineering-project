<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="20" fill="white" font-size="13" font-weight="600">9:41</text>
  <text x="195" y="63" text-anchor="middle" fill="white" font-size="19" font-weight="700">Notificações</text>
  <!-- Mark all read -->
  <text x="358" y="63" text-anchor="end" fill="white" font-size="13" opacity="0.85">Marcar lidas</text>

  <!-- Today section header -->
  <text x="24" y="132" fill="#94a3b8" font-size="12" font-weight="600">HOJE</text>

  <!-- Notification 1: new message (unread) -->
  <rect x="0" y="140" width="390" height="78" fill="white"/>
  <rect x="0" y="140" width="4" height="78" fill="#10b981"/>
  <circle cx="42" cy="179" r="22" fill="#e2e8f0"/>
  <text x="42" y="185" text-anchor="middle" fill="#64748b" font-size="13">JS</text>
  <!-- Unread dot -->
  <circle cx="58" cy="145" r="5" fill="#10b981"/>
  <text x="74" y="165" fill="#0f172a" font-size="14" font-weight="600">Nova mensagem · João Santos</text>
  <text x="358" y="165" text-anchor="end" fill="#94a3b8" font-size="12">10:26</text>
  <text x="74" y="183" fill="#64748b" font-size="13">Olá! Confirmado para amanhã às 8h30?</text>
  <text x="74" y="200" fill="#94a3b8" font-size="12">Lisboa → FEUP</text>
  <line x1="0" y1="218" x2="390" y2="218" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Notification 2: ride starting soon (unread) -->
  <rect x="0" y="218" width="390" height="78" fill="white"/>
  <rect x="0" y="218" width="4" height="78" fill="#f59e0b"/>
  <circle cx="42" cy="257" r="22" fill="#fef9c3"/>
  <text x="42" y="265" text-anchor="middle" font-size="20">🚗</text>
  <circle cx="58" cy="223" r="5" fill="#f59e0b"/>
  <text x="74" y="243" fill="#0f172a" font-size="14" font-weight="600">Boleia a começar em breve</text>
  <text x="358" y="243" text-anchor="end" fill="#94a3b8" font-size="12">09:52</text>
  <text x="74" y="261" fill="#64748b" font-size="13">A tua boleia começa em 30 minutos.</text>
  <text x="74" y="278" fill="#94a3b8" font-size="12">Lisboa → FEUP · 08:30</text>
  <line x1="0" y1="296" x2="390" y2="296" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Notification 3: rating received (read) -->
  <rect x="0" y="296" width="390" height="78" fill="#fafafa"/>
  <circle cx="42" cy="335" r="22" fill="#e2e8f0"/>
  <text x="42" y="341" text-anchor="middle" fill="#64748b" font-size="13">AC</text>
  <text x="74" y="321" fill="#64748b" font-size="14" font-weight="500">Avaliação recebida · Ana Costa</text>
  <text x="358" y="321" text-anchor="end" fill="#94a3b8" font-size="12">08:15</text>
  <text x="74" y="339" fill="#64748b" font-size="13">Avaliou-te com ⭐⭐⭐⭐⭐  (5.0)</text>
  <text x="74" y="356" fill="#94a3b8" font-size="12">"Excelente condutor, muito simpático!"</text>
  <line x1="0" y1="374" x2="390" y2="374" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Yesterday section header -->
  <text x="24" y="400" fill="#94a3b8" font-size="12" font-weight="600">ONTEM</text>

  <!-- Notification 4: reservation confirmed (read) -->
  <rect x="0" y="408" width="390" height="72" fill="#fafafa"/>
  <circle cx="42" cy="444" r="22" fill="#ecfdf5"/>
  <text x="42" y="452" text-anchor="middle" font-size="20">✓</text>
  <text x="74" y="430" fill="#64748b" font-size="14" font-weight="500">Reserva confirmada</text>
  <text x="358" y="430" text-anchor="end" fill="#94a3b8" font-size="12">17/03</text>
  <text x="74" y="448" fill="#64748b" font-size="13">João Santos confirmou a tua reserva.</text>
  <text x="74" y="466" fill="#94a3b8" font-size="12">Lisboa → FEUP · 18/03 08:30</text>
  <line x1="0" y1="480" x2="390" y2="480" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Notification 5: ride cancelled (read) -->
  <rect x="0" y="480" width="390" height="72" fill="#fafafa"/>
  <circle cx="42" cy="516" r="22" fill="#fee2e2"/>
  <text x="42" y="524" text-anchor="middle" font-size="20">✕</text>
  <text x="74" y="502" fill="#64748b" font-size="14" font-weight="500">Boleia cancelada</text>
  <text x="358" y="502" text-anchor="end" fill="#94a3b8" font-size="12">17/03</text>
  <text x="74" y="520" fill="#64748b" font-size="13">Maria Santos cancelou a boleia</text>
  <text x="74" y="538" fill="#94a3b8" font-size="12">Porto → Lisboa · 19/03 09:00</text>
  <line x1="0" y1="552" x2="390" y2="552" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Preferences section -->
  <rect x="16" y="566" width="358" height="128" fill="white" rx="12" filter="url(#shadow)"/>
  <text x="32" y="590" fill="#0f172a" font-size="15" font-weight="700">Preferências de Notificações</text>
  <!-- Toggle 1 -->
  <text x="32" y="616" fill="#0f172a" font-size="14">Novas mensagens</text>
  <!-- Toggle ON -->
  <rect x="316" y="604" width="42" height="24" fill="#10b981" rx="12"/>
  <circle cx="346" cy="616" r="10" fill="white"/>
  <!-- Toggle 2 -->
  <text x="32" y="650" fill="#0f172a" font-size="14">Actualizações de boleias</text>
  <rect x="316" y="638" width="42" height="24" fill="#10b981" rx="12"/>
  <circle cx="346" cy="650" r="10" fill="white"/>
  <!-- Toggle 3 -->
  <text x="32" y="684" fill="#64748b" font-size="14">Novos seguidores</text>
  <rect x="316" y="672" width="42" height="24" fill="#cbd5e1" rx="12"/>
  <circle cx="330" cy="684" r="10" fill="white"/>

  <!-- 4-tab green nav bar (Perfil active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#064e3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#064e3b" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#064e3b" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#ecfdf5" stroke-width="2"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Perfil</text>
</svg>
