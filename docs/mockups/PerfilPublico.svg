  <text x="32" y="598" fill="#0f172a" font-size="14" font-weight="600">Porto → FEUP</text>
  <text x="32" y="616" fill="#64748b" font-size="12">05 Mai  ·  09:00  ·  1 passageiro</text>
  <text x="356" y="600" text-anchor="end" fill="#10b981" font-size="12">Concluída ✓</text>

