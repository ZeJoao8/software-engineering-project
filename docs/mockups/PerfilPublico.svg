  <circle cx="195" cy="168" r="38" fill="#fef9c3" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="195" y="176" text-anchor="middle" fill="#92400e" font-size="22" font-weight="700">AC</text>
  <!-- Verified badge -->
  <circle cx="228" cy="196" r="11" fill="#10b981" stroke="white" stroke-width="2"/>
  <text x="228" y="200" text-anchor="middle" fill="white" font-size="10">✓</text>
  <!-- Name + uni -->
  <text x="195" y="226" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Ana Costa</text>
  <text x="195" y="246" text-anchor="middle" fill="#64748b" font-size="13">Engenharia Informática · FEUP</text>
  <!-- Stars -->
  <text x="158" y="268" fill="#f59e0b" font-size="16">★★★★★</text>
  <text x="246" y="268" fill="#64748b" font-size="13"> 4.9 (38)</text>
  <!-- Add friend button -->
  <rect x="130" y="278" width="130" height="30" fill="#10b981" rx="15"/>
  <text x="195" y="298" text-anchor="middle" fill="white" font-size="13" font-weight="600">+ Adicionar amigo</text>

  <!-- Stats row -->
  <rect x="16" y="334" width="110" height="76" fill="white" rx="12" filter="url(#sh)"/>
  <text x="71" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">Boleias</text>
  <text x="71" y="382" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="800">47</text>
  <text x="71" y="400" text-anchor="middle" fill="#64748b" font-size="11">realizadas</text>

  <rect x="140" y="334" width="110" height="76" fill="white" rx="12" filter="url(#sh)"/>
  <text x="195" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">CO₂ Poupado</text>
  <text x="195" y="382" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">45.2</text>
  <text x="195" y="400" text-anchor="middle" fill="#64748b" font-size="11">🌳 kg total</text>

  <rect x="264" y="334" width="110" height="76" fill="white" rx="12" filter="url(#sh)"/>
  <text x="319" y="358" text-anchor="middle" fill="#94a3b8" font-size="11">Ranking</text>
  <text x="319" y="382" text-anchor="middle" fill="#f59e0b" font-size="24" font-weight="800">#1</text>
  <text x="319" y="400" text-anchor="middle" fill="#64748b" font-size="11">🥇 nacional</text>

