<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="22" fill="#ecfdf5" font-size="13" font-weight="600">9:41</text>
  <path d="M26 66 L16 56 L26 46" stroke="#ecfdf5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="60" text-anchor="middle" fill="#ecfdf5" font-size="17" font-weight="700">Preferências de Condutor</text>
  <text x="195" y="80" text-anchor="middle" fill="#d1fae5" font-size="13">Personaliza a tua experiência de condução</text>

  <!-- Section: Passageiros -->
  <text x="24" y="128" fill="#94a3b8" font-size="12" font-weight="600">PASSAGEIROS</text>
  <rect x="16" y="136" width="358" height="112" fill="white" rx="12" filter="url(#sh)"/>

  <!-- Toggle: Apenas mulheres -->
  <text x="32" y="164" fill="#0f172a" font-size="14" font-weight="600">Apenas Mulheres</text>
  <text x="32" y="182" fill="#64748b" font-size="12">Limitar passageiros a mulheres</text>
  <rect x="318" y="154" width="42" height="24" fill="#bcbdc1" rx="12"/>
