  <rect x="318" y="352" width="42" height="24" fill="#bcbdc1" rx="12"/>
  <circle cx="330" cy="364" r="10" fill="white"/>
  <line x1="28" y1="394" x2="362" y2="394" stroke="#f1f5f9" stroke-width="1"/>

