<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="22" fill="#ecfdf5" font-size="13" font-weight="600">9:41</text>
  <text x="195" y="66" text-anchor="middle" fill="#ecfdf5" font-size="20" font-weight="700">Perfil</text>
  <!-- Edit button in header -->
  <rect x="326" y="50" width="50" height="30" fill="rgba(255,255,255,0.2)" rx="8"/>
  <text x="351" y="70" text-anchor="middle" fill="#ecfdf5" font-size="13">Editar</text>

  <!-- Profile card -->
  <rect x="16" y="122" width="358" height="190" fill="white" rx="16" filter="url(#sh)"/>
  <!-- Avatar -->
  <circle cx="195" cy="168" r="36" fill="#e2e8f0"/>
  <text x="195" y="175" text-anchor="middle" fill="#64748b" font-size="22">JJ</text>
  <!-- Rating -->
  <text x="195" y="220" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">José João</text>
  <text x="195" y="240" text-anchor="middle" fill="#64748b" font-size="13">up202406360@up.pt</text>
  <!-- Stars + rating -->
  <text x="152" y="262" fill="#f59e0b" font-size="16">★★★★★</text>
  <text x="240" y="262" fill="#64748b" font-size="13"> 4.8 (24 avaliações)</text>
  <!-- Gender badge -->
  <rect x="155" y="272" width="80" height="22" fill="#ecfdf5" rx="11"/>
  <text x="195" y="287" text-anchor="middle" fill="#047857" font-size="12">♂️  Masculino</text>

  <!-- Info card -->
  <rect x="16" y="324" width="358" height="126" fill="white" rx="12" filter="url(#sh)"/>
  <text x="32" y="348" fill="#94a3b8" font-size="12" font-weight="600">INFORMAÇÃO ACADÉMICA</text>
  <!-- Row: University -->
  <text x="32" y="372" fill="#64748b" font-size="13">Universidade</text>
  <text x="358" y="372" text-anchor="end" fill="#0f172a" font-size="13" font-weight="600">Universidade do Porto</text>
  <line x1="28" y1="380" x2="362" y2="380" stroke="#f1f5f9" stroke-width="1"/>
  <!-- Row: Course -->
  <text x="32" y="400" fill="#64748b" font-size="13">Curso</text>
  <text x="358" y="400" text-anchor="end" fill="#0f172a" font-size="13" font-weight="600">Engenharia Informática</text>
  <line x1="28" y1="408" x2="362" y2="408" stroke="#f1f5f9" stroke-width="1"/>
  <!-- Row: Cars -->
  <text x="32" y="428" fill="#64748b" font-size="13">🚗  Carro</text>
  <text x="358" y="428" text-anchor="end" fill="#0f172a" font-size="13" font-weight="600">Renault Clio · Azul · 45-AB-23</text>
  <text x="358" y="444" text-anchor="end" fill="#94a3b8" font-size="11">+ 1 carro</text>

  <!-- Stats row -->
  <rect x="16" y="462" width="170" height="80" fill="white" rx="12" filter="url(#sh)"/>
  <text x="101" y="488" text-anchor="middle" fill="#94a3b8" font-size="12">Weekly Streak</text>
  <text x="101" y="512" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">5</text>
  <text x="101" y="530" text-anchor="middle" fill="#64748b" font-size="12">🔥 semanas seguidas</text>

  <rect x="204" y="462" width="170" height="80" fill="white" rx="12" filter="url(#sh)"/>
  <text x="289" y="488" text-anchor="middle" fill="#94a3b8" font-size="12">CO₂ Poupado</text>
  <text x="289" y="512" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">23.45</text>
  <text x="289" y="530" text-anchor="middle" fill="#64748b" font-size="12">🌳 kg total</text>

