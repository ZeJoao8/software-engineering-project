  <text x="358" y="578" text-anchor="end" fill="#10b981" font-size="13">Ver todas →</text>
  <!-- 4 badge circles -->
  <circle cx="58" cy="618" r="24" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="58" y="626" text-anchor="middle" font-size="20">🌿</text>
  <circle cx="124" cy="618" r="24" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="124" y="626" text-anchor="middle" font-size="20">🚀</text>
  <circle cx="190" cy="618" r="24" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" opacity="0.6"/>
  <text x="190" y="626" text-anchor="middle" font-size="20" opacity="0.4">🏅</text>
  <circle cx="256" cy="618" r="24" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" opacity="0.6"/>
  <text x="256" y="626" text-anchor="middle" font-size="20" opacity="0.4">👑</text>
  <text x="318" y="608" fill="#94a3b8" font-size="22" font-weight="300">···</text>

  <!-- Logout button -->
  <rect x="16" y="676" width="358" height="48" fill="white" rx="12" stroke="#fee2e2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="195" y="705" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="600">Terminar Sessão</text>

  <!-- 4-tab green nav bar (Profile active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#064e3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#064e3b" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#064e3b" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#064e3b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#ecfdf5" stroke-width="2"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#ecfdf5" stroke-width="2" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Perfil</text>
</svg>
