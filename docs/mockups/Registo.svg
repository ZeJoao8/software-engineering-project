<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
  </defs>

  <!-- Full green background top -->
  <rect width="390" height="844" fill="#10b981"/>

  <!-- Status bar -->
  <text x="32" y="24" fill="#ecfdf5" font-size="13" font-weight="600">9:41</text>

  <!-- Logo + title (compact) -->
  <circle cx="195" cy="90" r="36" fill="rgba(255,255,255,0.15)"/>
  <circle cx="195" cy="90" r="30" fill="#ecfdf5" opacity="0.95"/>
  <path d="M180 95 L184 83 Q186 80 190 80 L200 80 Q204 80 206 83 L210 95 L210 100 Q210 103 207 103 L183 103 Q180 103 180 100 Z" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="185" cy="103" r="3.5" fill="#10b981"/>
  <circle cx="205" cy="103" r="3.5" fill="#10b981"/>

  <text x="195" y="148" text-anchor="middle" fill="white" font-size="26" font-weight="800">UniLink 🌱</text>

  <!-- White card -->
  <rect x="0" y="166" width="390" height="678" fill="white" rx="24"/>

  <!-- Tab toggle -->
  <rect x="80" y="184" width="230" height="36" fill="#ecfdf5" rx="18"/>
  <rect x="195" y="184" width="115" height="36" fill="#10b981" rx="18"/>
  <text x="137" y="208" text-anchor="middle" fill="#047857" font-size="14">Entrar</text>
  <text x="252" y="208" text-anchor="middle" fill="white" font-size="14" font-weight="700">Registar</text>

  <!-- Name field -->
  <text x="28" y="242" fill="#0f172a" font-size="13" font-weight="600">Nome Completo</text>
  <rect x="16" y="250" width="358" height="44" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="278" fill="#94a3b8" font-size="14">👤  José João</text>

  <!-- University field -->
  <text x="28" y="314" fill="#0f172a" font-size="13" font-weight="600">Universidade</text>
  <rect x="16" y="322" width="358" height="44" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="350" fill="#0f172a" font-size="14">🏛️  Universidade do Porto</text>

  <!-- Course field -->
  <text x="28" y="386" fill="#0f172a" font-size="13" font-weight="600">Curso</text>
  <rect x="16" y="394" width="358" height="44" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="422" fill="#94a3b8" font-size="14">📚  Engenharia Informática...</text>

  <!-- Gender picker -->
  <text x="28" y="458" fill="#0f172a" font-size="13" font-weight="600">Género</text>
  <rect x="16" y="466" width="170" height="40" fill="#ecfdf5" rx="10" stroke="#10b981" stroke-width="1.5"/>
  <text x="101" y="491" text-anchor="middle" fill="#047857" font-size="14" font-weight="600">Masculino ✓</text>
  <rect x="204" y="466" width="170" height="40" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="289" y="491" text-anchor="middle" fill="#94a3b8" font-size="14">Feminino</text>

  <!-- Email field -->
  <text x="28" y="528" fill="#0f172a" font-size="13" font-weight="600">Email Universitário</text>
  <rect x="16" y="536" width="358" height="44" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="564" fill="#94a3b8" font-size="14">📧  joao@feup.pt</text>

  <!-- Password fields row -->
  <text x="28" y="600" fill="#0f172a" font-size="13" font-weight="600">Password</text>
  <rect x="16" y="608" width="170" height="44" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="32" y="636" fill="#94a3b8" font-size="14">🔒  ••••••••</text>
  <text x="204" y="600" fill="#0f172a" font-size="13" font-weight="600">Confirmar</text>
  <rect x="204" y="608" width="170" height="44" fill="#f8fafc" rx="10" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220" y="636" fill="#94a3b8" font-size="14">🔒  ••••••••</text>

  <!-- Register button -->
  <rect x="16" y="670" width="358" height="52" fill="#10b981" rx="28"/>
  <text x="195" y="702" text-anchor="middle" fill="white" font-size="16" font-weight="700">CRIAR CONTA</text>

  <!-- Terms note -->
  <text x="195" y="740" text-anchor="middle" fill="#94a3b8" font-size="11">Ao criar conta, aceitas os Termos de Serviço e Privacidade</text>
</svg>
