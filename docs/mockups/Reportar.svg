<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="20" fill="white" font-size="13" font-weight="600">9:41</text>
  <path d="M24 66 L14 56 L24 46" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="205" y="63" text-anchor="middle" fill="white" font-size="19" font-weight="700">Reportar Utilizador</text>

  <!-- Warning banner -->
  <rect x="16" y="122" width="358" height="58" fill="#fef9c3" rx="10"/>
  <text x="195" y="145" text-anchor="middle" fill="#854d0e" font-size="14" font-weight="600">⚠️  Usa esta funcionalidade com responsabilidade</text>
  <text x="195" y="165" text-anchor="middle" fill="#92400e" font-size="12">Relatórios falsos podem resultar em suspensão de conta.</text>

  <!-- User being reported -->
  <rect x="16" y="194" width="358" height="88" fill="white" rx="12" filter="url(#shadow)"/>
  <text x="32" y="216" fill="#94a3b8" font-size="12" font-weight="600">A REPORTAR</text>
  <circle cx="52" cy="254" r="22" fill="#e2e8f0"/>
  <text x="52" y="260" text-anchor="middle" fill="#64748b" font-size="13">JS</text>
  <text x="82" y="248" fill="#0f172a" font-size="16" font-weight="700">João Santos</text>
  <text x="82" y="267" fill="#64748b" font-size="13">up202406360@up.pt</text>
  <text x="82" y="284" fill="#64748b" font-size="12">⭐ 4.6  ·  Condutor</text>

  <!-- Motivo label -->
  <text x="24" y="310" fill="#0f172a" font-size="15" font-weight="600">Motivo do relatório *</text>

  <!-- Reason dropdown -->
  <rect x="16" y="320" width="358" height="50" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="32" y="350" fill="#0f172a" font-size="14">Comportamento inapropriado</text>
  <text x="354" y="350" text-anchor="end" fill="#64748b" font-size="18">▾</text>

  <!-- Boleia associada -->
  <text x="24" y="396" fill="#0f172a" font-size="15" font-weight="600">Boleia em questão (opcional)</text>
  <rect x="16" y="406" width="358" height="50" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="32" y="436" fill="#0f172a" font-size="14">Lisboa → FEUP  ·  18/03/2026</text>
  <text x="354" y="436" text-anchor="end" fill="#64748b" font-size="18">▾</text>

  <!-- Description label -->
  <text x="24" y="484" fill="#0f172a" font-size="15" font-weight="600">Descrição *</text>
  <text x="356" y="484" text-anchor="end" fill="#94a3b8" font-size="12">0 / 500</text>

  <!-- Description textarea -->
  <rect x="16" y="494" width="358" height="120" fill="white" rx="10" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="32" y="522" fill="#94a3b8" font-size="14">Descreve o que aconteceu com o máximo</text>
  <text x="32" y="542" fill="#94a3b8" font-size="14">de detalhe possível...</text>

  <!-- Evidence note -->
  <rect x="16" y="628" width="358" height="46" fill="#f0f9ff" rx="10"/>
  <text x="195" y="648" text-anchor="middle" fill="#0284c7" font-size="13">💡  Podes adicionar evidências (screenshots) nas definições</text>
  <text x="195" y="666" text-anchor="middle" fill="#0284c7" font-size="12">de conta após enviar este relatório.</text>

  <!-- Submit button (danger red) -->
  <rect x="16" y="688" width="358" height="52" fill="#ef4444" rx="12"/>
  <text x="195" y="720" text-anchor="middle" fill="white" font-size="17" font-weight="700">Enviar Relatório</text>

  <!-- 4-tab green nav bar (Minhas active) -->
  <rect x="0" y="764" width="390" height="80" fill="#10b981"/>
  <path d="M40 793 L40 800 L58 800 L58 793 L49 782 Z" fill="none" stroke="#064e3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="793" width="10" height="7" fill="none" stroke="#064e3b" stroke-width="2" rx="1"/>
  <text x="49" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Boleias</text>
  <rect x="137" y="784" width="18" height="17" fill="none" stroke="#ecfdf5" stroke-width="1.8" rx="3"/>
  <line x1="141" y1="789" x2="151" y2="789" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="793" x2="151" y2="793" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="141" y1="797" x2="151" y2="797" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round"/>
  <text x="146" y="822" text-anchor="middle" fill="#ecfdf5" font-size="11" font-weight="700">Minhas</text>
  <path d="M237 783 L237 795 Q237 802 244 802 Q251 802 251 795 L251 783 Z" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M237 787 Q233 787 233 791 Q233 795 237 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M251 787 Q255 787 255 791 Q255 795 251 795" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="244" y1="802" x2="244" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="240" y1="805" x2="248" y2="805" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="244" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Ranking</text>
  <circle cx="341" cy="789" r="6" fill="none" stroke="#064e3b" stroke-width="1.8"/>
  <path d="M328 806 Q328 799 341 799 Q354 799 354 806" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="341" y="822" text-anchor="middle" fill="#064e3b" font-size="11">Perfil</text>
</svg>
