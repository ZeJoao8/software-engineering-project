<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>text { font-family: -apple-system, 'Helvetica Neue', sans-serif; }</style>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Green header -->
  <rect width="390" height="110" fill="#10b981"/>
  <text x="32" y="22" fill="#ecfdf5" font-size="13" font-weight="600">9:41</text>
  <path d="M26 66 L16 56 L26 46" stroke="#ecfdf5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="58" text-anchor="middle" fill="#ecfdf5" font-size="17" font-weight="700">Chat da Boleia</text>
  <text x="195" y="78" text-anchor="middle" fill="#d1fae5" font-size="13">Lisboa – Marquês → FEUP  ·  18/03</text>
  <text x="195" y="96" text-anchor="middle" fill="#d1fae5" font-size="12">3 participantes</text>

  <!-- Messages area (scrollable) -->
  <!-- Message 1: other user (João Santos - driver) -->
  <text x="24" y="140" fill="#94a3b8" font-size="11">João Santos  · Condutor</text>
  <rect x="16" y="146" width="240" height="58" fill="white" rx="14" rx-tl="4" filter="url(#sh)"/>
  <text x="32" y="168" fill="#0f172a" font-size="14">Olá a todos! Boleia confirmada</text>
  <text x="32" y="186" fill="#0f172a" font-size="14">para amanhã às 08:30. ✅</text>
