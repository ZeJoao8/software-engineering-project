  <!-- Driver badge -->
  <text x="82" y="138" fill="#10b981" font-size="11">• Condutor</text>

  <!-- Message 2: other user (Ana) -->
  <text x="24" y="222" fill="#94a3b8" font-size="11">Ana Costa</text>
  <rect x="16" y="228" width="200" height="44" fill="white" rx="14" rx-tl="4" filter="url(#sh)"/>
  <text x="32" y="252" fill="#0f172a" font-size="14">Ótimo! Vemo-nos lá 😊</text>
  <text x="30" y="268" fill="#94a3b8" font-size="11">10:25</text>

  <!-- Message 3: MY message (right side, green bubble) -->
  <rect x="134" y="290" width="240" height="44" fill="#10b981" rx="14" rx-tr="4"/>
  <text x="150" y="314" fill="white" font-size="14">Confirmado! Vou estar no</text>
  <text x="150" y="330" fill="white" font-size="14">Marquês às 08:25 👍</text>
  <text x="356" y="348" text-anchor="end" fill="#94a3b8" font-size="11">10:26</text>

  <!-- Message 4: other (João driver) -->
  <text x="24" y="374" fill="#94a3b8" font-size="11">João Santos</text>
  <rect x="16" y="380" width="220" height="44" fill="white" rx="14" filter="url(#sh)"/>
  <text x="32" y="404" fill="#0f172a" font-size="14">Perfeito! Até amanhã 🚗</text>
  <text x="30" y="420" fill="#94a3b8" font-size="11">10:27</text>
  <text x="74" y="372" fill="#10b981" font-size="11">• Condutor</text>

  <!-- Message 5: MY message -->
  <rect x="154" y="438" width="220" height="44" fill="#10b981" rx="14"/>
  <text x="170" y="456" fill="white" font-size="14">Até amanhã! 😄</text>
  <text x="356" y="476" text-anchor="end" fill="#94a3b8" font-size="11">10:28</text>

  <!-- Separator: Hoje -->
  <line x1="60" y1="508" x2="155" y2="508" stroke="#e2e8f0" stroke-width="1"/>
  <text x="195" y="512" text-anchor="middle" fill="#94a3b8" font-size="11">HOJE</text>
  <line x1="235" y1="508" x2="330" y2="508" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Message 6: system notification -->
  <rect x="80" y="520" width="230" height="36" fill="#ecfdf5" rx="10"/>
  <text x="195" y="543" text-anchor="middle" fill="#047857" font-size="12">🔒 Código de segurança enviado</text>

  <!-- Input area -->
  <rect x="0" y="694" width="390" height="70" fill="white" filter="url(#sh)"/>
  <line x1="0" y1="694" x2="390" y2="694" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="16" y="706" width="288" height="46" fill="#f8fafc" rx="23" stroke="#e2e8f0" stroke-width="1.5"/>
